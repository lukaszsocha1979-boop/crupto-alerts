
name: Crypto Alerts - Test logiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'alerts.py'
      - 'storage.py'
      - '.github/workflows/alerts-logic-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          pip install -r requirements.txt

      - name: Test wzrostów, spadków i ponownych alertów
        run: |
          python - <<'PY'
          import alerts

          now = 1800000000
          storage_box = {}

          alerts.time.time = lambda: now
          alerts.load_storage = lambda: storage_box.copy()
          alerts.save_storage = lambda data: storage_box.update(data)

          def prepare(direction):
              storage_box.clear()
              storage_box["ZEUS"] = {
                  "price_history": [
                      {
                          "timestamp": now - 900,
                          "price": 100.0
                      }
                  ],
                  "alert_levels": {},
                  "start_volume": None
              }

          def run_test(price):
              return alerts.check_alerts({
                  "ZEUS": {
                      "price": price,
                      "volume_24h": None
                  }
              })

          def expect_alert(price, level, direction):
              result = run_test(price)
              sign = "-" if direction == "down" else ""
              expected = f"próg {sign}{level}%"
              assert result and expected in result, (
                  f"Oczekiwano {expected}, otrzymano: {result}"
              )
              print(f"OK: {direction} {expected}")

          def expect_no_alert(price):
              result = run_test(price)
              assert result is None, (
                  f"Nieoczekiwany alert: {result}"
              )
              print("OK: brak niepotrzebnego alertu")

          # WZROSTY
          prepare("up")

          expect_alert(110, 9, "up")
          expect_no_alert(111)
          expect_no_alert(108)
          expect_alert(110, 9, "up")

          expect_alert(120, 18, "up")
          expect_alert(124, 24, "up")
          expect_alert(130, 30, "up")
          expect_alert(136, 36, "up")
          expect_alert(142, 42, "up")

          # SPADKI
          prepare("down")

          expect_alert(90, 9, "down")
          expect_no_alert(89)
          expect_no_alert(92)
          expect_alert(90, 9, "down")

          expect_alert(80, 18, "down")
          expect_alert(76, 24, "down")
          expect_alert(70, 30, "down")
          expect_alert(64, 36, "down")
          expect_alert(58, 42, "down")

          # WSZYSTKIE INTERWAŁY
          storage_box.clear()

          intervals = {
              "15m": 15 * 60,
              "30m": 30 * 60,
              "1h": 60 * 60,
              "4h": 4 * 60 * 60,
              "1d": 24 * 60 * 60
          }

          storage_box["ZEUS"] = {
              "price_history": [
                  {
                      "timestamp": now - seconds,
                      "price": 100.0
                  }
                  for seconds in intervals.values()
              ],
              "alert_levels": {},
              "start_volume": None
          }

          result = run_test(110)

          assert result is not None, "Brak alertów interwałowych"

          for interval in intervals:
              assert f"/ {interval}" in result, (
                  f"Brak alertu dla interwału {interval}: {result}"
              )
              print(f"OK: interwał {interval}")

          print("WSZYSTKIE TESTY LOGIKI ZAKOŃCZONE SUKCESEM")
          PY
