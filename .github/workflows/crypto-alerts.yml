name: Crypto Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: crypto-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crypto Alerts - 60 sprawdzeń co 6 minut
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |

          for i in $(seq 1 60)
          do

            echo ""
            echo "========================================"
            echo "🔄 Crypto Alerts - sprawdzenie $i/60"
            echo "========================================"

            echo ""
            echo "=== STORAGE BEFORE RUN ==="

            if [ -f storage.json ]; then
              python - <<'PY'
          import json

          try:
              with open("storage.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              for symbol, token in data.items():
                  history = token.get("price_history", [])
                  print(f"{symbol}: {len(history)} punktów historii")

          except Exception as e:
              print("Błąd odczytu storage:", e)
          PY
            else
              echo "Brak storage.json"
            fi

            echo ""
            echo "🚀 Uruchamiam Crypto Alerts..."

            python main.py

            echo ""
            echo "=== STORAGE AFTER RUN ==="

            if [ -f storage.json ]; then
              python - <<'PY'
          import json

          try:
              with open("storage.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              for symbol, token in data.items():
                  history = token.get("price_history", [])
                  print(f"{symbol}: {len(history)} punktów historii")

          except Exception as e:
              print("Błąd odczytu storage:", e)
          PY
            fi

            echo ""
            echo "💾 Zapisuję storage.json..."

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add storage.json

            if git diff --cached --quiet; then
              echo "ℹ️ Brak zmian w storage.json."
            else
              git commit -m "Update crypto alerts storage"
              git push
            fi

            if [ "$i" -lt 60 ]; then
              echo ""
              echo "⏳ Czekam 6 minut do następnego sprawdzenia..."
              sleep 360
            fi

          done

          echo ""
          echo "========================================"
          echo "✅ Zakończono 60 sprawdzeń."
          echo "========================================"
