
name: Crypto Alerts
# Telegram delivery verification is triggered by the dedicated commit message.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - storage.json
      - telegram_test_status.txt

concurrency:
  group: crypto-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crypto Alerts - jedno sprawdzenie
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

        run: |
          echo "=== STORAGE BEFORE RUN ==="

          if [ -f storage.json ]; then
            python - <<'PY'
          import json

          try:
              with open("storage.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              for symbol, token in data.items():
                  history = token.get("price_history", [])
                  print(f"{symbol}: {len(history)} punktów historii")

          except Exception as e:
              print("Błąd odczytu storage:", e)
              raise
          PY
          else
            echo "Brak storage.json"
          fi

          echo "Uruchamiam Crypto Alerts..."
          python main.py

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_COMMIT_MESSAGE}" == *"Verify Telegram delivery"* ]]; then
            echo "Wykonuję jednorazowy test wysyłki Telegram..."
            python - <<'PY'
          from telegram_sender import send_test

          if not send_test():
              raise SystemExit("TEST TELEGRAM NIEUDANY")
          print("TEST TELEGRAM ZAKOŃCZONY SUKCESEM")
          PY
            date -u +"Telegram test OK: %Y-%m-%dT%H:%M:%SZ" > telegram_test_status.txt
          fi

          echo "=== STORAGE AFTER RUN ==="

          if [ -f storage.json ]; then
            python - <<'PY'
          import json

          try:
              with open("storage.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              for symbol, token in data.items():
                  history = token.get("price_history", [])
                  print(f"{symbol}: {len(history)} punktów historii")

          except Exception as e:
              print("Błąd odczytu storage:", e)
              raise
          PY
          fi

          echo "Zapisuję storage.json..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add storage.json
          if [ -f telegram_test_status.txt ]; then
            git add telegram_test_status.txt
          fi

          if git diff --cached --quiet; then
            echo "Brak zmian w storage.json."
          else
            git commit -m "Update crypto alerts storage"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              echo "Zapis odrzucony — ponawiam po pobraniu najnowszego main ($attempt/3)..."
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
            done
            if [ "$pushed" != "true" ]; then
              echo "Nie udało się zapisać storage.json po 3 próbach."
              exit 1
            fi
          fi

          echo "Zakończono jedno sprawdzenie."
