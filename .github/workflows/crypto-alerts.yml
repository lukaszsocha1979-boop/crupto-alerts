name: Crypto Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crypto Alerts every 5 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          for i in $(seq 1 70)
          do
            echo "========================================"
            echo "Crypto Alerts - pomiar $i/70"
            echo "========================================"

            python main.py

            if [ "$i" -lt 70 ]; then
              echo "⏳ Czekam 4 minuty do następnego pomiaru..."
              sleep 240
            fi
          done

      - name: Save storage.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add storage.json

          if git diff --cached --quiet; then
            echo "ℹ️ Brak zmian w storage.json."
          else
            git commit -m "Update crypto alerts storage"
            git push
          fi
