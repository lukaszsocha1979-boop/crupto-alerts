name: Crypto Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "2/5 * * * *"

concurrency:
  group: crypto-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crypto Alerts every 5 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          for i in $(seq 1 68); do
            echo ""
            echo "========================================"
            echo "🔄 Crypto Alerts - sprawdzenie $i/68"
            echo "========================================"

            python main.py

            echo ""
            echo "=== STORAGE AFTER RUN ==="

            if [ -f storage.json ]; then
              python - <<'PY'
          import json

          with open("storage.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          for symbol, token in data.items():
              history = token.get("price_history", [])
              print(f"{symbol}: {len(history)} punktów historii")
          PY
            else
              echo "storage.json nie istnieje."
            fi

            echo "=========================="

            git add storage.json

            if git diff --cached --quiet; then
              echo "ℹ️ Brak zmian w storage.json."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git commit -m "Update crypto alerts storage"
              git push
            fi

            if [ "$i" -lt 68 ]; then
              echo ""
              echo "⏳ Czekam 5 minut do następnego sprawdzenia..."
              sleep 300
            fi
          done

          echo ""
          echo "✅ Zakończono 68 sprawdzeń."
