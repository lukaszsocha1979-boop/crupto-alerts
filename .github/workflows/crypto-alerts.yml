name: Crypto Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check storage before run
        run: |
          echo "=== STORAGE BEFORE ==="

          if [ -f storage.json ]; then
            python - <<'PY'
          import json

          with open("storage.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          for symbol, token in data.items():
              history = token.get("price_history", [])

              print(f"{symbol}: {len(history)} punktów historii")
          PY
          else
            echo "storage.json nie istnieje."
          fi

          echo "======================"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crypto Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          python main.py

      - name: Check storage after run
        run: |
          echo "=== STORAGE AFTER ==="

          if [ -f storage.json ]; then
            python - <<'PY'
          import json

          with open("storage.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          for symbol, token in data.items():
              history = token.get("price_history", [])

              print(f"{symbol}: {len(history)} punktów historii")
          PY
          else
            echo "storage.json nie istnieje."
          fi

          echo "====================="

      - name: Save storage.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add storage.json

          if git diff --cached --quiet; then
            echo "ℹ️ Brak zmian w storage.json."
          else
            git commit -m "Update crypto alerts storage"
            git push
          fi
