name: Test Birdeye ZEUS V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Birdeye V3 ZEUS
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://public-api.birdeye.so/defi/v3/price/stats/single"

          params = {
              "address": "ZEUS1aR7aX8DFFJf5QjWj2ftDDdNTroMNGo8YoQm3Gq",
              "list_timeframe": "15m,30m,1h,4h"
          }

          headers = {
              "accept": "application/json",
              "x-chain": "solana",
              "X-API-KEY": os.environ["BIRDEYE_API_KEY"]
          }

          print("🚀 TEST BIRDEYE V3 — ZEUS")
          print()
          print("URL:", url)
          print("Params:", params)
          print()

          response = requests.get(
              url,
              params=params,
              headers=headers,
              timeout=30
          )

          print("Status:", response.status_code)
          print("Response:")
          print(response.text)

          if response.status_code != 200:
              raise SystemExit(1)
          PY
