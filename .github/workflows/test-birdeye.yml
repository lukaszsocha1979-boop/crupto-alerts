
name: Test Birdeye W V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Birdeye V3 W
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://public-api.birdeye.so/defi/v3/price/stats/single"

          params = {
              "address": "85VBFQZC9TZkfaptBWjvUw7YbZjy52A6mjtPGjstQAmQ",
              "list_timeframe": "30m,1h,4h"
          }

          headers = {
              "accept": "application/json",
              "x-chain": "solana",
              "X-API-KEY": os.environ["BIRDEYE_API_KEY"]
          }

          print("TEST BIRDEYE V3 — W (Wormhole)")
          print("Params:", params)

          response = requests.get(
              url,
              params=params,
              headers=headers,
              timeout=30
          )

          print("Status:", response.status_code)
          print("Remaining-CU:", response.headers.get("x-credits-remaining"))
          print("Used-CU:", response.headers.get("x-credits-used"))
          print("Response:")
          print(response.text)

          if response.status_code != 200:
              raise SystemExit(1)
          PY
