
      - name: Test logiki alertów
        run: |
          python - <<'PY'
          import alerts

          now = 1800000000
          storage_box = {}

          alerts.time.time = lambda: now
          alerts.load_storage = lambda: storage_box.copy()
          alerts.save_storage = lambda data: storage_box.update(data)

          def test_case(price, direction, previous_level=None, expected_level=9):
              storage_box.clear()
              storage_box["ZEUS"] = {
                  "price_history": [
                      {
                          "timestamp": now - 15 * 60,
                          "price": 100.0
                      }
                  ],
                  "alert_levels": {
                      "15m": {
                          "up": previous_level if direction == "up" else None,
                          "down": previous_level if direction == "down" else None
                      }
                  },
                  "start_volume": None
              }

              message = alerts.check_alerts({
                  "ZEUS": {
                      "price": price,
                      "volume_24h": None
                  }
              })

              if not message:
                  raise RuntimeError("Brak oczekiwanego alertu")

              expected_text = f"próg {'-' if direction == 'down' else ''}{expected_level}%"

              if expected_text not in message:
                  raise RuntimeError(f"Nieprawidłowy próg: {message}")

              print("OK:", message)

          test_case(110, "up", expected_level=9)
          test_case(90, "down", expected_level=9)
          test_case(120, "up", previous_level=9, expected_level=18)

          print("TEST LOGIKI ALERTÓW ZAKOŃCZONY")
          PY
