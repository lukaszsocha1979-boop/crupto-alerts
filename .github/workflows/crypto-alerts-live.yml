name: Crypto Alerts Scheduler

on:
  workflow_dispatch:
  repository_dispatch:
    types: [crypto_alerts_tick]
  schedule:
    - cron: '2-59/5 * * * *'

concurrency:
  group: crypto-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdź rynek i wyślij alerty
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Zapisz historię cen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage.json
          if git diff --cached --quiet; then
            echo "Brak zmian w storage.json."
          else
            git commit -m "Update crypto alerts storage"
            git pull --rebase origin main
            git push
          fi
